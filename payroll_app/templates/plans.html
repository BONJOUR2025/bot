<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Plans</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; }
    table { border-collapse: collapse; }
    th, td { border: 1px solid #ddd; padding: 6px 8px; }
    th { background: #f5f5f5; }
    input { width: 120px; }
    .code { width: 70px; }
  </style>
</head>
<body>
  <h2>Планы продаж ({{ ym }})</h2>
  <p><a href="/payroll?year={{year}}&month={{month}}">← к расчёту</a></p>

  <table>
    <tr>
      <th>Код</th>
      <th>План ремонт/хим</th>
      <th>План косметика</th>
      <th>План обувь</th>
      <th></th>
    </tr>

    {% for code in employees %}
      {% set p = plans.get(code, {"repair":0,"cosm":0,"shoes":0}) %}
      <tr>
        <form method="post" action="/plans/save">
          <td><input class="code" name="emp_code" value="{{code}}" readonly></td>
          <td><input name="plan_repair" value="{{p.repair}}"></td>
          <td><input name="plan_cosm" value="{{p.cosm}}"></td>
          <td><input name="plan_shoes" value="{{p.shoes}}"></td>
          <td>
            <input type="hidden" name="year" value="{{year}}">
            <input type="hidden" name="month" value="{{month}}">
            <button type="submit">Сохранить</button>
          </td>
        </form>
      </tr>
    {% endfor %}
  </table>
</body>
</html>
