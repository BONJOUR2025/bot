name: MDM agent APK

# Сборка агента для корпоративных телефонов (device/mdm_agent).
# Локально собирать нечем: на рабочей машине нет ни JDK, ни Android SDK,
# поэтому APK собирается здесь и скачивается из артефактов сборки.

on:
  push:
    branches: [claude/init-wmebv3]
    paths:
      - 'device/mdm_agent/**'
      - '.github/workflows/mdm-agent.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Доставить Android SDK 34
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      # Подпись обязана быть стабильной от сборки к сборке: агент встаёт
      # владельцем устройства и не удаляется, поэтому APK с другим ключом на
      # телефон уже не встанет — обновить его можно будет только сбросом.
      - name: Восстановить ключ подписи
        env:
          KEYSTORE_B64: ${{ secrets.MDM_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Секрет MDM_KEYSTORE_B64 не задан — собирать нечем"
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/mdm-agent.p12"

      - name: Собрать APK
        working-directory: device/mdm_agent
        env:
          MDM_KEYSTORE_PATH: ${{ runner.temp }}/mdm-agent.p12
          MDM_KEYSTORE_PASSWORD: ${{ secrets.MDM_KEYSTORE_PASSWORD }}
          MDM_KEY_ALIAS: mdm
        run: gradle --no-daemon assembleRelease

      # Gradle при minSdk 24 не кладёт подпись v1 и не поддаётся уговорам через
      # DSL (enableV1Signing = true он молча игнорирует). Поэтому подписываем
      # явно инструментом SDK: провижининг по QR проверяет скачанный файл старым
      # способом, который читает только v1, и без неё телефон отказывается
      # настраиваться с обезличенным «Can't set up device».
      - name: Досигнать APK всеми схемами
        working-directory: device/mdm_agent
        env:
          MDM_KEYSTORE_PATH: ${{ runner.temp }}/mdm-agent.p12
          MDM_KEYSTORE_PASSWORD: ${{ secrets.MDM_KEYSTORE_PASSWORD }}
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -n1)
          "$APKSIGNER" sign \
            --ks "$MDM_KEYSTORE_PATH" --ks-type PKCS12 \
            --ks-pass "pass:$MDM_KEYSTORE_PASSWORD" \
            --ks-key-alias mdm --key-pass "pass:$MDM_KEYSTORE_PASSWORD" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            app/build/outputs/apk/release/app-release.apk
          echo "--- схемы подписи сразу после досигнывания ---"
          "$APKSIGNER" verify --verbose             app/build/outputs/apk/release/app-release.apk | grep -i "scheme"

      - name: Проверить подпись
        working-directory: device/mdm_agent
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -n1)
          APK=app/build/outputs/apk/release/app-release.apk
          "$APKSIGNER" verify --verbose --print-certs $APK
          # Без v1 провижининг по QR молча не работает — ловим это здесь, а не
          # на живом телефоне, стоя в салоне.
          "$APKSIGNER" verify --verbose $APK \
            | grep -q "v1 scheme (JAR signing): true"

      - uses: actions/upload-artifact@v4
        with:
          name: bonjour-mdm-agent
          path: device/mdm_agent/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
